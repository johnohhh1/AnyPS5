name: PR 7454 independent audit validation

on:
  push:
    branches: [validation/pr-7454-windows-linux-20261020]

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'johnohhh1/AnyPS5'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
          - os: ubuntu-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Exact PR, current-main rebase and integration checks
        run: python validation-7454/run.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: audit-7454-${{ matrix.os }}-python-${{ matrix.python }}
          path: validation-results-7454/
          retention-days: 14
